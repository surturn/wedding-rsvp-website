name: Keep n8n warm

# Pings the n8n /healthz endpoint on a schedule so the Railway service never
# goes cold — a cold start can drop an incoming RSVP. Also acts as an uptime
# check: the job fails (and notifies repo watchers) if n8n stops returning 200.

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub's minimum granularity is ~5 min)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping n8n /healthz
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://n8n-production-4aeb1.up.railway.app/healthz)
          echo "healthz -> $code"
          test "$code" = "200"
